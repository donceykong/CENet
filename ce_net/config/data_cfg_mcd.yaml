# MCD sequences grouped by the LiDAR they were recorded with.
# Each group's `sensor` references config/SENSORS/<name>.yaml.
# Sequence paths are relative to the dataset root in training_mcd.yaml /
# inference_mcd.yaml (e.g. /media/donceykong/donceys_data_ssd/datasets/mcd).
sensor_groups:
  - sensor: OS1_64
    sequences:
      - tuhh/tuhh_day_02
      - tuhh/tuhh_day_03
      - tuhh/tuhh_day_04
      - tuhh/tuhh_night_07
      - tuhh/tuhh_night_08
      - tuhh/tuhh_night_09
  - sensor: OS1_128
    sequences:
      - ntu/ntu_day_01
      - ntu/ntu_day_02
      - ntu/ntu_day_10
      - ntu/ntu_night_04
      - ntu/ntu_night_08
      - ntu/ntu_night_13

# Train/valid/test split ratios. Applied per-sensor-group so the sensor
# distribution is preserved across splits. Used only during training.
split: [0.8, 0.1, 0.1]

# Optional subset for inference. If omitted, inference runs over every
# sequence in sensor_groups above.
# infer_sequences:
#   - tuhh/tuhh_day_03
#   - ntu/ntu_day_01
