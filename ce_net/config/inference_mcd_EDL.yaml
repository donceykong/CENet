# Cross-domain inference: the MCD-trained EDL model run on KITTI-360 seq 0000.
# Output predictions are in MCD's 30-class space (not KITTI-360's taxonomy);
# input scans projected with config/SENSORS/HDL_64.yaml (Velodyne HDL-64E).
#
# To switch back to KTH inference: set dataset_name=MCD,
#   dataset_path=/media/donceykong/doncey_ssd_021/datasets/mcd,
#   data_config=.../data_cfg_mcd_kth.yaml.
# To switch back to NTU+TUHH in-domain inference: dataset_name=MCD,
#   dataset_path=/media/donceykong/donceys_data_ssd/datasets/mcd,
#   data_config=.../data_cfg_mcd.yaml (sensor_groups path takes over).
dataset_path: /media/donceykong/doncey_ssd_021/datasets/kitti360
dataset_name: KITTI-360
infer_or_train: infer
data_config: /home/donceykong/Desktop/ARPG/projects/OSM-BKI-FULL/CENet_OG/ce_net/config/data_cfg_mcd.yaml
relative_infer_dir: "inferred_labels/cenet_mcd_terrain_ntu_tuhh_pure_EDL"

inference:
  model_path: /media/donceykong/donceys_data_ssd/models/CENet/mcd_terrain_ntu_tuhh_pure_EDL/cenet_mcd-512-EDL
  split: test
