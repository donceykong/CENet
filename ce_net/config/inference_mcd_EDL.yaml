# Inference for the evidential (EDL) MCD model.
# By default runs on the NTU + TUHH sequences in data_cfg_mcd.yaml.
# To infer on held-out KTH instead: add an OS1_64 group with the kth_* seqs
# to data_cfg_mcd.yaml, set infer_sequences there, and point dataset_path at
# the KTH SSD (/media/donceykong/doncey_ssd_021/datasets/mcd).
dataset_path: /media/donceykong/donceys_data_ssd/datasets/mcd
dataset_name: MCD       # "KITTI-360", "CU-MULTI", or "MCD"
infer_or_train: infer   # "train" or "infer"
data_config: /home/donceykong/Desktop/ARPG/projects/OSM-BKI-FULL/CENet_OG/ce_net/config/data_cfg_mcd.yaml
relative_infer_dir: "inferred_labels/cenet_mcd_terrain_EDL"

inference:
  model_path: /media/donceykong/donceys_data_ssd/models/CENet/mcd_terrain_ntu_tuhh_EDL/cenet_mcd-1024-EDL
  split: test           # "valid", "train", or "test"
